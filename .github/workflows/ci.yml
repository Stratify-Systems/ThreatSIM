name: ThreatSIM Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Build & Test ──────────────────────────────────
  build-and-test:
    name: Build & Test Go Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Dependencies
        run: go mod download

      - name: Build Binary
        run: CGO_ENABLED=0 GOOS=linux go build -o bin/threatsim ./cmd/threatsim/

      - name: Run Tests
        run: go test -v ./...

  # ── Security Detection Validation (Core Feature) ─
  # This is the star job — it proves ThreatSIM's own
  # detection engine works using itself.
  security-validation:
    name: Security Detection Validation
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build ThreatSIM
        run: go build -o bin/threatsim ./cmd/threatsim/

      # This is the key CI/CD gate — runs entirely locally,
      # no Docker, no Postgres, no external dependencies.
      - name: Validate Brute Force Detection
        run: ./bin/threatsim validate --plugin brute_force --expect-alert --json

      - name: Validate Port Scan Detection
        run: ./bin/threatsim validate --plugin port_scan --expect-alert --json

      - name: Validate Privilege Escalation Detection
        run: ./bin/threatsim validate --plugin privilege_escalation --expect-alert --json

  # ── Docker Build (optional, validates Dockerfiles) ─
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        run: docker build -t threatsim-backend:ci .
