version: "1.0"
simulations:
  - name: "Validate Content Type and Body"
    request:
      method: "GET"
      path: "/posts/1"
    expected:
      status_code: 200
      headers:
        "Content-Type": "application/json; charset=utf-8"
      body_contains: "userId"
  - name: "Fail on Missing Header"
    request:
      method: "GET"
      path: "/posts/1"
    expected:
      status_code: 200
      headers:
        "X-Security-Header": "Strict"
