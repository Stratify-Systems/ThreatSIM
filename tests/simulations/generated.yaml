version: "1.0"
simulations:
  - name: "Unauthenticated access to protected endpoint should be denied"
    request:
      method: "GET"
      path: "/api/admin/secrets"
      headers:
        Content-Type: "application/json"
    expected:
      status_code: 401
      body_contains: "Unauthorized"

  - name: "IDOR/BOLA test: User B cannot access User A private data"
    plugin: "idor"
    config:
      auth_path: "/auth/login"
      user_a_payload: '{"username":"admin","password":"secret123"}'
      user_b_payload: '{"username":"guest","password":"password123"}'
      token_json_path: "data.token"
      id_json_path: "data.user.id"
      target_method: "GET"
      target_path: "/api/users/{id}/private-data"
      expected_status_code: 403
      expected_body_contains: "Unauthorized"

  - name: "JWT forge: reject modified signature"
    plugin: "jwt_forge"
    config:
      auth_path: "/auth/login"
      auth_payload: '{"username":"guest","password":"password123"}'
      token_json_path: "data.token"
      target_path: "/api/admin/secrets"
      forge_claims:
        role: "admin"
      attack_mode: "signature_tamper"
      expected_status_code: 401
      expected_body_contains: "invalid signature"

  - name: "JWT forge: reject alg=none token"
    plugin: "jwt_forge"
    config:
      auth_path: "/auth/login"
      auth_payload: '{"username":"guest","password":"password123"}'
      token_json_path: "data.token"
      target_path: "/api/admin/secrets"
      forge_claims:
        role: "admin"
      attack_mode: "alg_none"
      expected_status_code: 401
      expected_body_contains: "invalid signature"

  - name: "JWT forge: reject token signed with weak secret"
    plugin: "jwt_forge"
    config:
      auth_path: "/auth/login"
      auth_payload: '{"username":"guest","password":"password123"}'
      token_json_path: "data.token"
      target_path: "/api/admin/secrets"
      forge_claims:
        role: "admin"
      attack_mode: "weak_secret"
      weak_secret: "weaksecret"
      expected_status_code: 401
      expected_body_contains: "invalid signature"

  - name: "Bruteforce protection on login endpoint"
    plugin: "bruteforce"
    config:
      path: "/login"
      username: "admin"
      num_requests: 20
      expected_status_code: 429
      expected_body_contains: "locked"

  - name: "Rate limiting on public search endpoint"
    plugin: "rate_limit"
    config:
      path: "/api/search"
      method: "GET"
      num_requests: 50
      concurrency: 10
      expected_status_code: 429
      expected_body_contains: "rate limit"

  - name: "CORS audit: reject untrusted origins on private data endpoint"
    plugin: "cors_audit"
    config:
      path: "/api/users/100/private-data"
      method: "GET"
      custom_origin: "https://attacker.com"
      test_null_origin: true
      expected_allow_credentials: false
      expected_status_code: 200
