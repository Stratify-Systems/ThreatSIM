version: "1.0"
simulations:
  - name: "JWT Signature Verification"
    plugin: "jwt_forge"
    config:
      auth_path: "/auth/login"
      auth_payload: '{"username":"user", "password":"123"}'
      token_json_path: "data.token"
      target_path: "/api/admin/system"
      forge_claims:
        role: "admin"
      attack_mode: "signature_tamper"
      expected_status_code: 401

  - name: "Tenant Isolation Validation"
    plugin: "idor"
    config:
      auth_path: "/auth/login"
      user_a_payload: '{"username":"admin", "password":"123"}'
      user_b_payload: '{"username":"guest", "password":"123"}'
      token_json_path: "token"
      id_json_path: "id"
      target_method: "GET"
      target_path: "/api/users/{id}/private-data"
      expected_status_code: 403
      expected_body_contains: "Forbidden"

  - name: "Login Brute-force Protection"
    plugin: "bruteforce"
    config:
      path: "/auth/login"
      username: "admin"
      num_requests: 5
      expected_status_code: 429
      expected_body_contains: "locked"

  - name: "CORS Policy Audit"
    plugin: "cors_audit"
    config:
      path: "/api/products"
      method: "GET"
      custom_origin: "https://attacker.com"
      test_null_origin: true
      expected_allow_credentials: false
      expected_status_code: 200

  - name: "Search Throttling Validation"
    plugin: "rate_limit"
    config:
      path: "/api/search"
      method: "GET"
      num_requests: 50
      concurrency: 10
      expected_status_code: 429
      expected_body_contains: "rate limit"

  - name: "Admin Endpoint Protection - Missing Token"
    request:
      method: "GET"
      path: "/api/admin/system"
    expected:
      status_code: 401
      body_contains: "Unauthorized"

  - name: "Admin Endpoint Protection - Forbidden Access"
    request:
      method: "GET"
      path: "/api/admin/system"
      headers:
        Authorization: "Bearer invalid-token"
    expected:
      status_code: 403
      body_contains: "Forbidden"
