version: "1.0"
simulations:
  - name: "JWT IDOR Validation"
    plugin: "idor"
    config:
      auth_path: "/login"
      user_a_payload: '{"username":"user_a", "password":"password_a"}'
      user_b_payload: '{"username":"user_b", "password":"password_b"}'
      token_json_path: "token"
      id_json_path: "id"
      target_method: "GET"
      target_path: "/api/users/{id}/private-data"
      expected_status_code: 403
      expected_body_contains: "Unauthorized"

  - name: "Login Brute Force Protection"
    plugin: "bruteforce"
    config:
      path: "/login"
      username: "user_a"
      num_requests: 5
      expected_status_code: 429
      expected_body_contains: "locked"

  - name: "CORS Untrusted Origin Validation"
    plugin: "cors_audit"
    config:
      path: "/api/users/100/private-data"
      method: "GET"
      custom_origin: "https://attacker.com"
      test_null_origin: true
      expected_allow_credentials: false
      expected_status_code: 200
