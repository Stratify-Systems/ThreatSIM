version: "1.0"
simulations:
  - name: "Admin Login Bruteforce Custom Wordlist Test"
    plugin: "bruteforce"
    config:
      path: "/login"
      username: "admin"
      username_field: "username"
      password_field: "password"
      wordlist_path: "tests/simulations/sample_wordlist.txt"
      num_requests: 10
      expected_status_code: 429
      expected_body_contains: "locked"
