version: "1.0"
simulations:
  # This simulation will PASS because the API returns a 200 OK
  - name: "Verify Public Endpoint Accessibility"
    request:
      method: "GET"
      path: "/posts/1"
    expected:
      status_code: 200

  # This simulation will FAIL. 
  # We expect a 403 Forbidden since we are providing a bad token,
  # but the mock API ignores auth and will return a 201 Created.
  - name: "Simulate Unauthorized POST Request"
    request:
      method: "POST"
      path: "/posts"
      headers:
        "Authorization": "Bearer invalid_token"
      body: |
        {"title": "hacked", "body": "malicious content", "userId": 1}
    expected:
      status_code: 403
