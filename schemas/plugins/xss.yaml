# Schema Example for XSS Plugin
# This plugin injects malicious script tags into inputs and validates
# that the application does not reflect the raw payload back in the response body.

name: "Example XSS Validation"
plugin: "xss"
config:
  path: "/api/search"        # (Required) The endpoint path
  method: "GET"              # (Optional) HTTP Method, defaults to GET
  query_params:              # (Optional) Key-value pairs to fuzz in URL
    q: "test"
    sort: "asc"
